<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot — gym equipment waitlist</title>
<link rel="preconnect" href="https://fonts.googleapis"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <button id="back" hidden aria-label="Go back">Back</button>
    <span class="brand">Spot</span>
    <!-- Gym Location Selector -->
    <div class="gym-selector">
      <label for="gym-location" class="gym-label">
        <svg viewBox="0 0 24 24" width="18" height="18"
            fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
          <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
          <circle cx="12" cy="10" r="2.5"/>
        </svg>
        <span class="sr-only">Gym location</span>
      </label>

      <select id="gym-location" name="gym-location"
              aria-label="Choose gym location">
        <option value="" selected>Select Gym</option>
        <option value="provo">Provo</option>
        <option value="orem">Orem</option>
        <option value="lehi">Lehi</option>
        <option value="american-fork">American Fork</option>
        <option value="salt-lake-city">Salt Lake City</option>
      </select>
    </div>
    <div class="menu-wrap">
      <button id="menu-toggle" type="button"
              aria-expanded="false" aria-controls="spot-menu">
        ☰ Menu
      </button>

      <div id="spot-menu" class="spot-menu" hidden>
        <div class="menu-user">
          <span id="menu-avatar" class="menu-avatar">?</span>
          <strong id="menu-name">My Account</strong>
        </div>

        <button id="profile-open" type="button">My Profile</button>
        <button id="theme-toggle" type="button">Dark Mode</button>
        <button id="speed" type="button" aria-pressed="false">
          30x Time
        </button>

        <hr>

        <button id="checkin" class="menu-danger" type="button">
          Check Out
        </button>
      </div>
    </div>
  </header>
  <main id="screen"></main>
</div>
<div class="modal" id="modal" role="alertdialog" aria-modal="true" aria-labelledby="mt" hidden><div class="box"><p id="mt">Are you sure you want to check out? You'll lose your current session and waitlists</p><button class="btn danger" id="co-yes">Check out</button><button class="btn alt" id="co-no">Stay checked in</button></div></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
